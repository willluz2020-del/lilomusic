name: Gerar APK VMB Music

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list | head -50

      - name: Instalar Android SDK necessário
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VMB-Music.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: VMB-Music-APK
          path: VMB-Music.apk
